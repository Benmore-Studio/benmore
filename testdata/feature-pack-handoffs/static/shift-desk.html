<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Shift handoffs</title><style>body{margin:0;background:#f3f6f7;color:#173448;font:16px system-ui}main{max-width:760px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:32px;margin:12px 0}p{line-height:1.6}form{display:flex;gap:8px;margin:24px 0}input{min-width:0;flex:1;padding:12px;border:1px solid #b7c5cf;border-radius:8px}button,a{padding:10px;border-radius:8px}button{border:0;background:#173448;color:white;cursor:pointer}article{background:white;border:1px solid #c5d2d8;border-radius:12px;padding:16px;margin:12px 0}article h2{margin:0 0 8px;font-size:19px}.badge{color:#326b54;font-size:14px}#error{color:#8c2531}footer{color:#62747e;margin-top:32px;font-size:14px}</style></head><body><main><header><span>OPERATIONS / HANDOFFS</span><a href="/" data-testid="home">Library</a></header><h1>Leave the next shift ready.</h1><p>Capture a handoff, check its items, and close the loop. Each account has its own workspace.</p><div id="identity" data-testid="identity"></div><form id="new" data-testid="handoff-form"><input name="title" data-testid="handoff-title" placeholder="What should the next shift know?" required maxlength="120"><button data-testid="handoff-create">Add handoff</button></form><p id="error" data-testid="error" role="alert"></p><section id="cards" data-testid="handoff-cards"></section><footer>Reusable feature module · native authentication and scoped records</footer></main><script type="module">
import bm from '/_internal/bm.js';
const cards=document.querySelector('#cards'),error=document.querySelector('#error');
const state={rows:[],ready:false};window.handoffDesk={bm,state,refresh};
function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
async function refresh(){const value=await bm.api.get('/api/handoffs?limit=100');state.rows=value.data||value.rows||value;cards.replaceChildren();for(const row of state.rows){const card=el('article','');card.dataset.id=row.id;card.append(el('h2',row.title));const status=el('p',row.status);status.className='badge';card.append(status);const button=el('button',row.status==='complete'?'Completed':'Complete handoff');button.dataset.testid='complete-'+row.id;button.disabled=row.status==='complete';button.onclick=async()=>{try{error.textContent='';await bm.api.post('/api/handoffs/'+row.id+'/complete',{});await refresh()}catch(e){error.textContent=e.message}};card.append(button);cards.append(card)}if(!state.rows.length)cards.append(el('p','No handoffs yet. Add your first one above.'));state.ready=true}
document.querySelector('#new').onsubmit=async e=>{e.preventDefault();try{error.textContent='';await bm.api.post('/api/handoffs',{title:new FormData(e.target).get('title')});e.target.reset();await refresh()}catch(e){error.textContent=e.message}};
try{const p=await bm.auth.me();document.querySelector('#identity').textContent='Signed in as '+(p.email||p.user?.email||'your account');await refresh()}catch(e){error.textContent='Sign in to open your handoffs.';const a=el('a','Sign in');a.href='/login';a.dataset.testid='login';document.querySelector('#identity').append(a)}
</script></body></html>
