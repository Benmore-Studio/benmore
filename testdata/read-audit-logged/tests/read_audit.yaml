# Outside compliance: hipaa a failed read-audit write keeps the old behavior
# (the read answers) but is logged instead of discarded; reads are still
# recorded with the client address.
audited_read_records_ip:
  as_user: "reader@test.com"
  steps:
    - get: "/api/patients"
      expect:
        status: 200
    - sql: "SELECT 1 FROM _benmore_read_audit WHERE table_name = 'patients' AND query_type = 'list' AND user_email = 'reader@test.com' AND client_ip <> '' LIMIT 1"
      expect:
        rows: 1

failed_audit_write_still_answers:
  as_user: "reader@test.com"
  steps:
    - sql: "CREATE TRIGGER audit_down BEFORE INSERT ON _benmore_read_audit BEGIN SELECT RAISE(ABORT, 'audit down'); END"
    - get: "/api/patients"
      expect:
        status: 200
    - sql: "DROP TRIGGER audit_down"

# Outside hipaa anonymous reads are not recorded (as before), even of a
# table read_audit lists; a signed-in read of it is.
anonymous_read_is_not_audited:
  anon: true
  setup:
    - sql: "INSERT INTO notices (title) VALUES ('open hours')"
  steps:
    - get: "/api/notices"
      expect:
        status: 200
    # Absence asserted as one row (NOT EXISTS).
    - sql: "SELECT 1 WHERE NOT EXISTS (SELECT 1 FROM _benmore_read_audit WHERE table_name = 'notices' AND user_id = 0)"
      expect:
        rows: 1

signed_in_read_of_listed_public_table_is_audited:
  as_user: "reader2@test.com"
  steps:
    - get: "/api/notices"
      expect:
        status: 200
    - sql: "SELECT 1 FROM _benmore_read_audit WHERE table_name = 'notices' AND user_email = 'reader2@test.com'"
      expect:
        rows: 1

# The admin panel shows the audit tables and the credential tables and never
# writes them: no create, edit or delete control on the pages, and the write
# routes refuse (a hand-made audit row would say someone changed or read a
# record they never touched).
admin_panel_never_writes_audit_or_credential_tables:
  as_user: "paneladmin@test.com"
  as_role: "admin"
  steps:
    - get: "/api/patients"
      expect:
        status: 200
    - get: "/_admin/_benmore_read_audit"
      expect:
        status: 200
        contains: "never writes it"
        not_contains:
          - "/_admin/api/_benmore_read_audit"
          - "admin-create"
    - get: "/_admin/_benmore_audit_log"
      expect:
        status: 200
        contains: "never writes it"
        not_contains:
          - "/_admin/api/_benmore_audit_log"
          - "admin-create"
    - api: "POST /_admin/api/_benmore_audit_log/create"
      data:
        action: "delete"
        table_name: "patients"
        row_id: "2"
        user_email: "someone-else@test.com"
      expect:
        status: 403
        json:
          error: admin_table_read_only
    - api: "POST /_admin/api/_benmore_read_audit/create"
      data:
        table_name: "patients"
        row_id: "2"
        query_type: "read"
        user_email: "someone-else@test.com"
      expect:
        status: 403
        json:
          error: admin_table_read_only
    - api: "POST /_admin/api/_benmore_read_audit/update/1"
      data:
        user_email: "someone-else@test.com"
      expect:
        status: 403
        json:
          error: admin_table_read_only
    - api: "POST /_admin/api/_benmore_read_audit/delete/1"
      expect:
        status: 403
        json:
          error: admin_table_read_only
    - api: "POST /_admin/api/_benmore_sessions/create"
      data:
        email: "someone-else@test.com"
      expect:
        status: 403
        json:
          error: admin_table_read_only
    # Absence asserted as one row (NOT EXISTS): nothing hand-made was stored,
    # and the first read-audit row is still there, unchanged.
    - sql: "SELECT 1 WHERE NOT EXISTS (SELECT 1 FROM _benmore_audit_log WHERE user_email = 'someone-else@test.com') AND NOT EXISTS (SELECT 1 FROM _benmore_read_audit WHERE user_email = 'someone-else@test.com') AND NOT EXISTS (SELECT 1 FROM _benmore_sessions WHERE id IS NULL) AND EXISTS (SELECT 1 FROM _benmore_read_audit WHERE id = 1)"
      expect:
        rows: 1

# Every other framework table is shown and never written either: a hand-made
# job runs a flow with a payload of the writer's choice, and a hand-made record
# permission skips the share checks. The users table and the app's own tables
# stay writable in the panel.
admin_panel_never_writes_other_framework_tables:
  as_user: "paneladmin2@test.com"
  as_role: "admin"
  steps:
    - get: "/_admin/_benmore_jobs"
      expect:
        status: 200
        contains: "never writes it"
        not_contains:
          - "/_admin/api/_benmore_jobs"
          - "admin-create"
    - api: "POST /_admin/api/_benmore_jobs/create"
      data:
        job_type: "flow"
        flow_name: "panel-forged-flow"
        payload: '{"user_id": 1}'
      expect:
        status: 403
        json:
          error: admin_table_read_only
          table: _benmore_jobs
          docs: auth.admin_panel_accounts
    - api: "POST /_admin/api/_benmore_permissions/create"
      data:
        resource_type: "patients"
        resource_id: "2"
        grant_type: "user"
        grantee_id: "panel-forged-grant@test.com"
        permission: "write"
      expect:
        status: 403
        json:
          error: admin_table_read_only
    - api: "POST /_admin/api/_benmore_migrations/delete/1"
      expect:
        status: 403
        json:
          error: admin_table_read_only
    - sql: "SELECT 1 WHERE NOT EXISTS (SELECT 1 FROM _benmore_jobs WHERE flow_name = 'panel-forged-flow') AND NOT EXISTS (SELECT 1 FROM _benmore_permissions WHERE grantee_id = 'panel-forged-grant@test.com')"
      expect:
        rows: 1
    - get: "/_admin/_benmore_users"
      expect:
        status: 200
        contains: "/_admin/api/_benmore_users/"
        not_contains: "never writes it"
    - get: "/_admin/patients"
      expect:
        status: 200
        contains: "/_admin/api/patients/"
        not_contains: "never writes it"
