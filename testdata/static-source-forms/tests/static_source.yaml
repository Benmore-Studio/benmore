# Script source (.ts, .tsx, .jsx) and `run: compute` modules under static/ are
# never served: not at /static/<path>, not at the URL-root alias /<path>, and
# not under another spelling of either. A refused request gets the answer
# /static/<path> gives, a plain 404, so the two forms cannot be told apart.
# Compiled output and ordinary assets are served as before.
#
# The files: app.tsx imports lib/label.ts (browser code); flows/sign.yaml runs
# server/sign.ts, which imports server/key.ts, and server/plain.js (server
# code); widget.jsx is source nothing imports; assets/x.js and styles.css are
# ordinary assets.
#
# Three expectations are written once and reused by alias:
#   refused       the plain 404 /static/<path> answers with, no source text
#   refused_head  the same for HEAD (no body to read)
#   not_served    a 404 of either kind with no source text, for a spelling
#                 that names the file only on a case-insensitive file system
#
# Byte ranges, conditional requests and a link inside static/ are covered by
# the Go tests in static_source_url_forms_test.go (this runner sends no
# request headers).

# The control as it was: /static/<path>.
source_is_refused_at_static:
  anon: true
  steps:
    - {get: "/static/app.tsx", expect: &refused {status: 404, contains: "404 page not found", not_contains: ["SOURCE-ONLY", "SERVER-ONLY", "import ", "export "], headers: {Cache-Control: "no-store", Content-Type: "text/plain; charset=utf-8"}}}
    - {get: "/static/lib/label.ts", expect: *refused}
    - {get: "/static/widget.jsx", expect: *refused}
    - {get: "/static/server/sign.ts", expect: *refused}
    - {get: "/static/server/key.ts", expect: *refused}
    - {get: "/static/server/sign.js", expect: *refused}
    - {get: "/static/server/key.js", expect: *refused}
    - {get: "/static/server/plain.js", expect: *refused}

# The same files by their root alias, with the same answer.
source_is_refused_at_the_url_root:
  anon: true
  steps:
    - {get: "/app.tsx", expect: *refused}
    - {get: "/lib/label.ts", expect: *refused}
    - {get: "/widget.jsx", expect: *refused}
    - {get: "/server/sign.ts", expect: *refused}
    - {get: "/server/key.ts", expect: *refused}
    - {get: "/server/sign.js", expect: *refused}
    - {get: "/server/key.js", expect: *refused}
    - {get: "/server/plain.js", expect: *refused}

# HEAD says as little as GET.
head_requests_are_refused:
  anon: true
  steps:
    - {api: "HEAD /static/app.tsx", expect: &refused_head {status: 404, headers: {Cache-Control: "no-store", Content-Type: "text/plain; charset=utf-8"}}}
    - {api: "HEAD /app.tsx", expect: *refused_head}
    - {api: "HEAD /static/lib/label.ts", expect: *refused_head}
    - {api: "HEAD /lib/label.ts", expect: *refused_head}
    - {api: "HEAD /static/widget.jsx", expect: *refused_head}
    - {api: "HEAD /widget.jsx", expect: *refused_head}
    - {api: "HEAD /static/server/sign.ts", expect: *refused_head}
    - {api: "HEAD /server/sign.ts", expect: *refused_head}
    - {api: "HEAD /static/server/key.ts", expect: *refused_head}
    - {api: "HEAD /server/key.ts", expect: *refused_head}
    - {api: "HEAD /static/server/sign.js", expect: *refused_head}
    - {api: "HEAD /server/sign.js", expect: *refused_head}
    - {api: "HEAD /static/server/key.js", expect: *refused_head}
    - {api: "HEAD /server/key.js", expect: *refused_head}
    - {api: "HEAD /static/server/plain.js", expect: *refused_head}
    - {api: "HEAD /server/plain.js", expect: *refused_head}

# A trailing slash and a query string name the same file.
trailing_slash_and_query_forms_are_refused:
  anon: true
  steps:
    - {get: "/static/app.tsx/", expect: *refused}
    - {get: "/static/app.tsx?download=1", expect: *refused}
    - {get: "/static/app.tsx?v=0123456789ab", expect: *refused}
    - {get: "/app.tsx/", expect: *refused}
    - {get: "/app.tsx?download=1", expect: *refused}
    - {get: "/app.tsx?v=0123456789ab", expect: *refused}
    - {get: "/static/lib/label.ts/", expect: *refused}
    - {get: "/static/lib/label.ts?download=1", expect: *refused}
    - {get: "/static/lib/label.ts?v=0123456789ab", expect: *refused}
    - {get: "/lib/label.ts/", expect: *refused}
    - {get: "/lib/label.ts?download=1", expect: *refused}
    - {get: "/lib/label.ts?v=0123456789ab", expect: *refused}
    - {get: "/static/widget.jsx/", expect: *refused}
    - {get: "/static/widget.jsx?download=1", expect: *refused}
    - {get: "/static/widget.jsx?v=0123456789ab", expect: *refused}
    - {get: "/widget.jsx/", expect: *refused}
    - {get: "/widget.jsx?download=1", expect: *refused}
    - {get: "/widget.jsx?v=0123456789ab", expect: *refused}
    - {get: "/static/server/sign.ts/", expect: *refused}
    - {get: "/static/server/sign.ts?download=1", expect: *refused}
    - {get: "/static/server/sign.ts?v=0123456789ab", expect: *refused}
    - {get: "/server/sign.ts/", expect: *refused}
    - {get: "/server/sign.ts?download=1", expect: *refused}
    - {get: "/server/sign.ts?v=0123456789ab", expect: *refused}
    - {get: "/static/server/key.ts/", expect: *refused}
    - {get: "/static/server/key.ts?download=1", expect: *refused}
    - {get: "/static/server/key.ts?v=0123456789ab", expect: *refused}
    - {get: "/server/key.ts/", expect: *refused}
    - {get: "/server/key.ts?download=1", expect: *refused}
    - {get: "/server/key.ts?v=0123456789ab", expect: *refused}
    - {get: "/static/server/sign.js/", expect: *refused}
    - {get: "/static/server/sign.js?download=1", expect: *refused}
    - {get: "/static/server/sign.js?v=0123456789ab", expect: *refused}
    - {get: "/server/sign.js/", expect: *refused}
    - {get: "/server/sign.js?download=1", expect: *refused}
    - {get: "/server/sign.js?v=0123456789ab", expect: *refused}
    - {get: "/static/server/key.js/", expect: *refused}
    - {get: "/static/server/key.js?download=1", expect: *refused}
    - {get: "/static/server/key.js?v=0123456789ab", expect: *refused}
    - {get: "/server/key.js/", expect: *refused}
    - {get: "/server/key.js?download=1", expect: *refused}
    - {get: "/server/key.js?v=0123456789ab", expect: *refused}
    - {get: "/static/server/plain.js/", expect: *refused}
    - {get: "/static/server/plain.js?download=1", expect: *refused}
    - {get: "/static/server/plain.js?v=0123456789ab", expect: *refused}
    - {get: "/server/plain.js/", expect: *refused}
