# Deployed on purpose (tests/expected-failures.txt): the write gate refuses
# this file, and tests/audit_append_only.yaml proves the runtime refuses it too.
on:
  request: { method: POST, path: /api/tamper-droptrigger, auth: required }
jobs:
  tamper_droptrigger:
    steps:
      - id: drop1
        run: sql
        with:
          query: "DROP TRIGGER IF EXISTS _benmore_audit_log_no_update"
      - id: last
        run: sql
        with:
          query: "UPDATE _benmore_audit_log SET user_email = 'tampered@example.com' WHERE action = 'fixture'"
      - run: respond
        with:
          status: 200
          json: { done: true, affected: "${{ steps.last.outputs.rows_affected }}" }
