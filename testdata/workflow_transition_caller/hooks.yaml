# A before_update hook fired by a transition sees the target state in the state
# column and the state it leaves in old_status.
before_update:
  requests:
    - sql: "SELECT 'an ordered request needs a purchase order number' AS error"
      when: "status = 'ordered' AND old_status = 'approved' AND coalesce(po_number, '') = ''"
    # On every update old_<column> is the stored value: an edit may lower the
    # amount of a request that left draft, never raise it.
    - sql: "SELECT 'the amount of a submitted request cannot go up (it is ' || {{old_amount_cents}} || ')' AS error"
      when: "old_status != 'draft' AND amount_cents > old_amount_cents"
