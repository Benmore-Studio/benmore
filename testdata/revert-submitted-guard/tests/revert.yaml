# The SQL steps that write escalation_count / submitted_at stand for the
# server's own writes (a flow or cron step), which hooks do not gate.

a_revert_that_leaves_the_server_set_columns_alone_succeeds:
  as_user: "ann@revert.test"
  setup:
    - sql: "INSERT INTO requests (id, title, amount_cents, escalation_count, submitted_at, user_id) VALUES (8101, 'Laptop', 90000, 2, '2026-03-01T09:00:00Z', {{user_id}})"
  steps:
    - api: "PATCH /api/requests/8101"       # version 1 holds the row as inserted
      json: { title: "Laptpo" }
      expect: { status: 200 }
    - api: "PATCH /api/requests/8101"
      json: { amount_cents: 95000 }
      expect: { status: 200 }
    # The guard is in force for an ordinary update.
    - api: "PATCH /api/requests/8101"
      json: { escalation_count: 0 }
      expect: { status: 422, contains: "set by the server" }
    # Version 1 holds the same escalation_count and submitted_at as the row.
    - api: "POST /api/requests/8101/revert/1"
      json: {}
      expect:
        status: 200
        json: { status: reverted }
    - sql: "SELECT id FROM requests WHERE id = 8101 AND title = 'Laptop' AND amount_cents = 90000 AND escalation_count = 2 AND submitted_at IS NOT NULL"
      expect: { rows: 1 }

a_revert_that_would_change_a_server_set_column_is_refused:
  as_user: "bob@revert.test"
  setup:
    - sql: "INSERT INTO requests (id, title, amount_cents, user_id) VALUES (8102, 'Desk', 40000, {{user_id}})"
  steps:
    - api: "PATCH /api/requests/8102"       # version 1: not escalated, not submitted
      json: { title: "Standing desk" }
      expect: { status: 200 }
    - sql: "UPDATE requests SET escalation_count = 1, submitted_at = '2026-03-02T10:00:00Z' WHERE id = 8102"
    # Reverting to version 1 would put escalation_count back to 0.
    - api: "POST /api/requests/8102/revert/1"
      json: {}
      expect: { status: 422, contains: "set by the server" }
    - sql: "SELECT id FROM requests WHERE id = 8102 AND title = 'Standing desk' AND escalation_count = 1 AND submitted_at IS NOT NULL"
      expect: { rows: 1 }

a_revert_to_a_version_taken_after_the_server_write_succeeds:
  as_user: "cat@revert.test"
  setup:
    - sql: "INSERT INTO requests (id, title, amount_cents, user_id) VALUES (8103, 'Chair', 20000, {{user_id}})"
  steps:
    - sql: "UPDATE requests SET escalation_count = 3, submitted_at = '2026-03-03T11:00:00Z' WHERE id = 8103"   # version 1
    - api: "PATCH /api/requests/8103"       # version 2: 'Chair', escalated 3 times
      json: { title: "Chair (mesh)" }
      expect: { status: 200 }
    - api: "PATCH /api/requests/8103"       # version 3
      json: { title: "Chair (leather)", amount_cents: 35000 }
      expect: { status: 200 }
    - api: "POST /api/requests/8103/revert/2"
      json: {}
      expect: { status: 200 }
    - sql: "SELECT id FROM requests WHERE id = 8103 AND title = 'Chair' AND amount_cents = 20000 AND escalation_count = 3"
      expect: { rows: 1 }
    # Version 1 is the row before the server escalated it.
    - api: "POST /api/requests/8103/revert/1"
      json: {}
      expect: { status: 422, contains: "set by the server" }
    - sql: "SELECT id FROM requests WHERE id = 8103 AND escalation_count = 3"
      expect: { rows: 1 }

# The admin panel shows the table's stored versions (requests_history) and
# never writes them: a version that is forged, rewritten or deleted there
# would be what the versions API lists and what a revert restores. The table
# itself stays writable in the panel, and the revert still works.
admin_panel_never_writes_version_history:
  as_user: "paneladmin@revert.test"
  as_role: "admin"
  setup:
    - sql: "INSERT INTO requests (id, title, amount_cents, user_id) VALUES (8104, 'Monitor', 30000, {{user_id}})"
  steps:
    - api: "PATCH /api/requests/8104"       # version 1 holds 'Monitor'
      json: { title: "Monitor (27 inch)" }
      expect: { status: 200 }
    - api: "POST /_admin/api/requests_history/update/8104"
      data:
        title: "panel-rewritten-version"
      expect:
        status: 403
        json:
          error: admin_table_read_only
          table: requests_history
          docs: versioning.history_table
    - api: "POST /_admin/api/requests_history/delete/8104"
      expect:
        status: 403
        json:
          error: admin_table_read_only
    - api: "POST /_admin/api/requests_history/create"
      data:
        id: "8104"
        title: "panel-forged-version"
        amount_cents: "1"
        user_id: "1"
        _version: "7"
        _valid_from: "2020-01-01 00:00:00"
        _change_type: "update"
      expect:
        status: 403
        json:
          error: admin_table_read_only
    - sql: "SELECT 1 WHERE (SELECT COUNT(*) FROM requests_history WHERE id = 8104) = 1 AND EXISTS (SELECT 1 FROM requests_history WHERE id = 8104 AND _version = 1 AND title = 'Monitor')"
      expect: { rows: 1 }
    - get: "/_admin/requests_history"
      expect:
        status: 200
        contains: "never writes it"
        not_contains:
          - "/_admin/api/requests_history"
          - "admin-create"
    - get: "/_admin/requests"
      expect:
        status: 200
        contains: "/_admin/api/requests/"
        not_contains: "never writes it"
    - get: "/api/requests/8104/versions/1"
      expect:
        status: 200
        contains: "Monitor"
        not_contains: "27 inch"
    - api: "POST /api/requests/8104/revert/1"
      json: {}
      expect:
        status: 200
        json: { status: reverted }
    - sql: "SELECT id FROM requests WHERE id = 8104 AND title = 'Monitor'"
      expect: { rows: 1 }
