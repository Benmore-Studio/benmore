# Three people: ann files a claim with a receipt, mallory is another user,
# max is a manager.
owner_reads_their_claim_and_its_receipt:
  as_user: "ann@claims.test"
  users:
    - "mallory@claims.test"
    - "max@claims.test"
  setup:
    - sql: "DELETE FROM claims"
  steps:
    - api: "POST /api/_upload"
      data: { kind: private }
      files:
        file: { name: "receipt.txt", content: "Taxi 23.50" }
      save: { receipt: "path" }
      expect: { status: 200 }
    - api: "POST /api/claims"
      json: { title: "Taxi", amount_cents: 2350, receipt_url: "{{receipt}}" }
      save: { claim_id: "id" }
      expect: { status: 200 }
    - sql: "SELECT id FROM claims WHERE id = {{claim_id}} AND user_id = {{user_id}} AND receipt_url = '{{receipt}}'"
      expect: { rows: 1 }
    # The stored reference alone opens nothing.
    - get: "{{receipt}}"
      expect: { status: 403 }
    # The owner signs it against the claim and reads the bytes back.
    - get: "/api/_signed_url?path={{receipt}}&record_table=claims&record_id={{claim_id}}"
      save: { signed: "path" }
      expect: { status: 200 }
    - get: "{{signed}}"
      expect: { status: 200, contains: "Taxi 23.50" }

    # Another signed-in user: no row, no file.
    - set_auth: "none"
    - api: "POST /api/_auth/token"
      json: { email: "mallory@claims.test", password: "testpass123" }
      save: { mallory: "token" }
      expect: { status: 200 }
    - set_auth: "{{mallory}}"
    - get: "/api/claims"
      expect: { status: 200, json_length: 0, not_contains: "Taxi" }
    - get: "/api/claims/{{claim_id}}"
      expect: { status: 404 }
    - api: "PATCH /api/claims/{{claim_id}}"
      json: { amount_cents: 1 }
      expect: { status: 404 }
    - get: "/api/_signed_url?path={{receipt}}&record_table=claims&record_id={{claim_id}}"
      expect: { status: 403 }
    - get: "/api/_signed_url?path={{receipt}}"
      expect: { status: 403 }
    - sql: "SELECT id FROM claims WHERE id = {{claim_id}} AND amount_cents = 2350"
      expect: { rows: 1 }

    # A manager reads and changes every claim, and can open its receipt.
    - sql: "UPDATE _benmore_users SET role = 'manager' WHERE email = 'max@claims.test' RETURNING id"
      expect: { rows: 1 }
    - set_auth: "none"
    - api: "POST /api/_auth/token"
      json: { email: "max@claims.test", password: "testpass123" }
      save: { max: "token" }
      expect: { status: 200 }
    - set_auth: "{{max}}"
    - get: "/api/claims"
      expect: { status: 200, json_length: 1, contains: "Taxi" }
    - api: "PATCH /api/claims/{{claim_id}}"
      json: { amount_cents: 2000 }
      expect: { status: 200 }
    - sql: "SELECT id FROM claims WHERE id = {{claim_id}} AND amount_cents = 2000 AND user_id = {{user_id}}"
      expect: { rows: 1 }
    - get: "/api/_signed_url?path={{receipt}}&record_table=claims&record_id={{claim_id}}"
      save: { signed_for_max: "path" }
      expect: { status: 200 }
    - get: "{{signed_for_max}}"
      expect: { status: 200, contains: "Taxi 23.50" }

a_file_cannot_be_signed_through_someone_elses_claim:
  as_user: "ann@claims.test"
  users:
    - "mallory@claims.test"
  setup:
    - sql: "DELETE FROM claims"
  steps:
    - api: "POST /api/_upload"
      data: { kind: private }
      files:
        file: { name: "receipt.txt", content: "Hotel 180.00" }
      save: { receipt: "path" }
      expect: { status: 200 }
    - api: "POST /api/claims"
      json: { title: "Hotel", amount_cents: 18000, receipt_url: "{{receipt}}" }
      expect: { status: 200 }
    # mallory copies the reference into a claim of her own: still not hers to open.
    - set_auth: "none"
    - api: "POST /api/_auth/token"
      json: { email: "mallory@claims.test", password: "testpass123" }
      save: { mallory: "token" }
      expect: { status: 200 }
    - set_auth: "{{mallory}}"
    - api: "POST /api/claims"
      json: { title: "Copied", amount_cents: 100, receipt_url: "{{receipt}}" }
      save: { copy_id: "id" }
      expect: { status: 200 }
    - get: "/api/_signed_url?path={{receipt}}&record_table=claims&record_id={{copy_id}}"
      expect: { status: 403, contains: "this record does not own the file" }

signed_out_callers_get_nothing:
  anon: true
  steps:
    - get: "/api/claims"
      expect: { status: 401 }
    - get: "/api/_signed_url?path=/uploads/private/x.txt&record_table=claims&record_id=1"
      expect: { status: 401 }
