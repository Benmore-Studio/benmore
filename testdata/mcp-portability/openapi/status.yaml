openapi: 3.0.3
info: {title: Message status, version: '1'}
paths:
  /messages/{id}:
    get:
      operationId: getMessageStatus
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Message delivery status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status, sent_at, delivered_at, recipient, subject]
                properties:
                  id: {type: integer}
                  status: {type: string}
                  sent_at: {type: string}
                  delivered_at: {type: string}
                  recipient: {type: string}
                  subject: {type: string}
