site_name: "ws-room-patterns"
auth:
  identifier: email
ws_rooms:
  "room-:id": room_members(room_id, member_id)
  "chat::id": room_members(room_id, member_id)
  # Not a usable pattern (`*` is not a wildcard): the write gate refuses this
  # file, and a deployed copy closes the rooms it was written for.
  "talk:*": room_members(room_id, member_id)
