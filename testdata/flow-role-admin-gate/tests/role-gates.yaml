# Anyone can sign up and found an organisation, which makes them its `admin`
# (groups.bootstrap.founding_role). That tenant role must not open a flow
# gated `role: admin`: the flow's payload is trusted to come from the app.
a_tenant_admin_does_not_pass_a_role_admin_flow:
  as_user: "founder@roles.test"
  setup:
    - sql: "INSERT INTO organizations (name) VALUES ('Other Co')"
  steps:
    - api: "POST /api/_groups/create"
      json: { name: "Acme" }
      save: { org_id: "group_id" }
      expect:
        status: 200
        json: { status: created, founding_role: admin }
    - sql: "SELECT id FROM org_members WHERE org_id = {{org_id}} AND user_id = {{user_id}} AND member_role = 'admin'"
      expect: { rows: 1 }
    - sql: "SELECT id FROM organizations WHERE name = 'Other Co'"
      save: { other_org: "id" }
      expect: { rows: 1 }
    # Another tenant's id in the payload, and the caller's own: both refused.
    - api: "POST /api/internal/log-activity"
      json: { org_id: "{{other_org}}", note: "written into another tenant" }
      expect:
        status: 403
        json: { error: Forbidden }
    - api: "POST /api/internal/log-activity"
      json: { org_id: "{{org_id}}", note: "written into my own tenant" }
      expect: { status: 403 }
    - sql: "SELECT id FROM activity WHERE note LIKE 'written into %'"
      expect: { rows: 0 }
    # The same account still passes a table's `role:admin` rule inside its tenant.
    - api: "PATCH /api/organizations/{{org_id}}"
      json: { name: "Acme Ltd" }
      expect: { status: 200 }
    - sql: "SELECT id FROM organizations WHERE id = {{org_id}} AND name = 'Acme Ltd'"
      expect: { rows: 1 }
    # A tenant admin is not a finance user either.
    - api: "POST /api/reports/spend"
      json: {}
      expect: { status: 403 }
    # A flow that lists several tenant roles in its own SQL admits it.
    - api: "POST /api/period/close"
      json: {}
      expect:
        status: 200
        json: { closed: true }

the_global_admin_passes_a_role_admin_flow:
  as_user: "root@roles.test"
  as_role: "admin"
  setup:
    - sql: "INSERT INTO organizations (name) VALUES ('Globex')"
  steps:
    - sql: "SELECT id FROM organizations WHERE name = 'Globex'"
      save: { org: "id" }
      expect: { rows: 1 }
    - api: "POST /api/internal/log-activity"
      json: { org_id: "{{org}}", note: "queued work" }
      expect:
        status: 200
        json: { logged: true }
    - sql: "SELECT id FROM activity WHERE org_id = {{org}} AND note = 'queued work'"
      expect: { rows: 1 }
    # A global admin passes every role gate.
    - api: "POST /api/reports/spend"
      json: {}
      expect: { status: 200 }

a_tenant_finance_user_passes_a_role_finance_flow:
  as_user: "fin@roles.test"
  setup:
    - sql: "INSERT INTO organizations (name) VALUES ('Initech'), ('Initrode')"
    - sql: "INSERT INTO org_members (org_id, user_id, member_role) SELECT id, {{user_id}}, 'finance' FROM organizations WHERE name = 'Initech'"
    - sql: "INSERT INTO activity (org_id, note) SELECT id, 'one' FROM organizations WHERE name = 'Initech'"
    - sql: "INSERT INTO activity (org_id, note) SELECT id, 'two' FROM organizations WHERE name = 'Initech'"
    - sql: "INSERT INTO activity (org_id, note) SELECT id, 'another tenant' FROM organizations WHERE name = 'Initrode'"
  steps:
    - sql: "SELECT id FROM organizations WHERE name = 'Initech'"
      save: { org: "id" }
      expect: { rows: 1 }
    - api: "POST /api/reports/spend"
      json: {}
      expect:
        status: 200
        json: { entries: 2 }
    - api: "POST /api/internal/log-activity"
      json: { org_id: "{{org}}", note: "finance is not admin" }
      expect: { status: 403 }
    - api: "POST /api/org/rename"
      json: { name: "Renamed by finance" }
      expect:
        status: 403
        json: { error: not_org_admin }
    - api: "POST /api/period/close"
      json: {}
      expect:
        status: 200
        json: { closed: true }
    - sql: "SELECT id FROM organizations WHERE id = {{org}} AND name = 'Initech'"
      expect: { rows: 1 }
    - sql: "SELECT id FROM activity WHERE note = 'finance is not admin'"
      expect: { rows: 0 }

