      save: { org: "id" }
      expect: { rows: 1 }
    - api: "POST /api/reports/spend"
      json: {}
      expect: { status: 403 }
    - api: "POST /api/internal/log-activity"
      json: { org_id: "{{org}}", note: "written by a member" }
      expect: { status: 403 }
    - api: "POST /api/period/close"
      json: {}
      expect:
        status: 403
        json: { error: not_finance_or_org_admin }
    - sql: "SELECT id FROM activity WHERE note = 'written by a member'"
      expect: { rows: 0 }

# What a builder writes when the tenant's own admins should pass: the flow
# checks the caller's membership row.
a_tenant_admin_passes_a_flow_that_checks_the_membership_row:
  as_user: "owner@roles.test"
  setup:
    - sql: "INSERT INTO organizations (name) VALUES ('Someone else')"
  steps:
    - api: "POST /api/_groups/create"
      json: { name: "Umbrella" }
      save: { org_id: "group_id" }
      expect: { status: 200 }
    - api: "POST /api/org/rename"
      json: { name: "Umbrella Corp" }
      expect:
        status: 200
        json: { renamed: true }
    - sql: "SELECT id FROM organizations WHERE id = {{org_id}} AND name = 'Umbrella Corp'"
      expect: { rows: 1 }
    - sql: "SELECT id FROM organizations WHERE name = 'Someone else'"
      expect: { rows: 1 }

