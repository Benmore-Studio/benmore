# The supported way to hand a job the user it works for: a payload key of the
# app's own choosing.
on:
  request:
    method: POST
    path: /api/job-writes-target
    auth: required
jobs:
  go:
    steps:
      - run: sql
        with:
          query: "INSERT INTO notes (title, body, user_id) VALUES (:label, 'job', :target_user_id)"
      - run: respond
        with: { status: 200, json: { ok: true } }
