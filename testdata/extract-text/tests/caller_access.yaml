# The owner's own row, through an API token that has no read scope on
# documents: a direct GET is refused, and so is the step.
extract_text_refuses_a_token_without_read_scope_on_the_table:
  as_user: "owner@test.com"
  setup:
    - sql: "INSERT INTO documents (id, file_url, user_id) VALUES (4, 'uploads/private/sample.pdf', {{user_id}})"
  steps:
    - api: "POST /api/_auth/api-tokens"
      json:
        name: "contracts only"
        scopes: "contracts:read"
      save:
        scoped_token: "token"
      expect:
        status: 200
    - set_auth: "{{scoped_token}}"
    - get: "/api/documents/4"
      expect:
        status: 403
    - api: "POST /api/documents/4/extract"
      expect:
        status: 202
    - flush: "jobs"
    - sql: "SELECT id FROM documents WHERE id = 4 AND extract_error = 'extract_text refused: the signed-in caller cannot read the `record:` row'"
      expect:
        rows: 1

extract_text_passes_a_token_with_read_scope_on_the_table:
  as_user: "owner@test.com"
  setup:
    - sql: "INSERT INTO documents (id, file_url, user_id) VALUES (5, 'uploads/private/sample.pdf', {{user_id}})"
  steps:
    - api: "POST /api/_auth/api-tokens"
      json:
        name: "documents reader"
        scopes: "documents:read"
      save:
        scoped_token: "token"
      expect:
        status: 200
    - set_auth: "{{scoped_token}}"
    - get: "/api/documents/5"
      expect:
        status: 200
    - api: "POST /api/documents/5/extract"
      expect:
        status: 202
    - flush: "jobs"
    - sql: "SELECT id FROM documents WHERE id = 5 AND extract_error = 'extract_text: unsupported_file'"
      expect:
        rows: 1
