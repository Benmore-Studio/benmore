# A request-chosen reference needs a caller who could read the `record:` row
# through auto-CRUD: the table's read mode, the credential's read scope and
# the per-row scope. The per-row scope alone is empty on a table with no owner
# or tenant column (contracts, briefs), so every signed-in caller used to pass
# there. uploads/ is not copied into the test workspace: a caller who passes
# stops at the private read (`extract_text: unsupported_file`), and no parser
# runs.

extract_text_refuses_an_admin_only_table_for_an_ordinary_user:
  as_user: "intruder@test.com"
  setup:
    - sql: "INSERT INTO contracts (id, file_url) VALUES (1, 'uploads/private/sample.pdf')"
  steps:
    - get: "/api/contracts/1"
      expect:
        status: 404
    - api: "POST /api/contracts/1/extract"
      expect:
        status: 202
    - flush: "jobs"
    - sql: "SELECT id FROM contracts WHERE id = 1 AND extract_error = 'extract_text refused: the signed-in caller cannot read the `record:` row'"
      expect:
        rows: 1

extract_text_passes_an_admin_on_an_admin_only_table:
  as_user: "admin@test.com"
  as_role: "admin"
  setup:
    - sql: "INSERT INTO contracts (id, file_url) VALUES (2, 'uploads/private/sample.pdf')"
  steps:
    - api: "POST /api/contracts/2/extract"
      expect:
        status: 202
    - flush: "jobs"
    - sql: "SELECT id FROM contracts WHERE id = 2 AND extract_error = 'extract_text: unsupported_file'"
      expect:
        rows: 1

