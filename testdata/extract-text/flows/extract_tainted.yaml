on:
  request: { method: POST, path: /api/extract-path, auth: required, mode: async }
jobs:
  extract_tainted:
    steps:
      - id: text
        run: extract_text
        with:
          source_path: "${{ params.path }}"
        on_error:
          - run: sql
            query: UPDATE documents SET extract_error = :e WHERE id = 2
            params: { e: "${{ error }}" }
