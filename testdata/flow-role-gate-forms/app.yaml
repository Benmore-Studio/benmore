# A flow's `role:` gate takes ONE role name. This app shows what a comma list
# does (it admits nobody but a global admin) and the three ways to let several
# roles in: an `if:` on the account's own role, a SQL step that also counts
# role grants, and a synchronous gate in front of queued work.
site_name: "Flow role gate forms"
auth:
  identifier: email
access:
  stock_moves:
    read: role:warehouse,manager
    write: off                  # written by the flows only
    update: off
    delete: off
