# A flow's `role:` gate names one role or several, as a YAML list or a
# comma-separated string, and admits a caller who holds any of them. The other
# flows refuse in a step instead: an `if:` on the account's own role, a SQL
# step that also counts role grants, and a synchronous gate in front of queued
# work.
site_name: "Flow role gate forms"
auth:
  identifier: email
access:
  stock_moves:
    read: role:warehouse,manager
    write: off                  # written by the flows only
    update: off
    delete: off
