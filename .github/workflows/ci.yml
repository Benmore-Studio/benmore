name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Vet
        run: go vet -tags sqlite_fts5 ./...
      - name: Build
        run: go build -tags sqlite_fts5 -o benmore .
      - name: Test
        run: go test -tags sqlite_fts5 ./...
