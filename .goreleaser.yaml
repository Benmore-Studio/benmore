# GoReleaser config for the open-source Benmore framework binary (`benmore`).
#
# The SQLite driver is cgo, so cross-compilation needs a C toolchain for every
# target. This config is designed to run INSIDE the `goreleaser-cross` Docker
# image (see .github/workflows/release.yml), which bundles osxcross (macOS SDK),
# mingw (Windows), and the Linux cross GCCs - so one Linux runner produces every
# binary. The per-target CC/CXX below are the compiler names that image ships.
#
# Local sanity check (no publish):
#   docker run --rm -v "$PWD":/w -w /w ghcr.io/goreleaser/goreleaser-cross:v1.26.3 \
#     goreleaser release --snapshot --clean
version: 2

project_name: benmore

before:
  hooks:
    - go mod download

builds:
  - id: benmore
    binary: benmore
    main: .
    env:
      - CGO_ENABLED=1
      # Pick the cross compiler that matches the target. These names are
      # provided by the goreleaser-cross image. Resolves to a single CC=… / CXX=…
      # per build; unmatched branches emit nothing.
      - >-
        {{- if eq .Os "linux" }}
          {{- if eq .Arch "amd64" }}CC=x86_64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm64" }}CC=aarch64-linux-gnu-gcc{{- end }}
        {{- end }}
        {{- if eq .Os "darwin" }}
          {{- if eq .Arch "amd64" }}CC=o64-clang{{- end }}
          {{- if eq .Arch "arm64" }}CC=oa64-clang{{- end }}
        {{- end }}
        {{- if eq .Os "windows" }}CC=x86_64-w64-mingw32-gcc{{- end }}
      - >-
        {{- if eq .Os "linux" }}
          {{- if eq .Arch "amd64" }}CXX=x86_64-linux-gnu-g++{{- end }}
          {{- if eq .Arch "arm64" }}CXX=aarch64-linux-gnu-g++{{- end }}
        {{- end }}
        {{- if eq .Os "darwin" }}
          {{- if eq .Arch "amd64" }}CXX=o64-clang++{{- end }}
          {{- if eq .Arch "arm64" }}CXX=oa64-clang++{{- end }}
        {{- end }}
        {{- if eq .Os "windows" }}CXX=x86_64-w64-mingw32-g++{{- end }}
    flags:
      - -tags=sqlite_fts5
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # mingw arm64 cross-toolchain isn't reliably present; skip until there's
      # demand. Self-hosters are overwhelmingly linux/macOS.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids:
      - benmore
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - NOTICE
      - src: docs/**/*
        strip_parent: false

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: Benmore-Studio
    name: benmore
  draft: false
  prerelease: auto
  name_template: "benmore {{ .Tag }}"
  header: |
    Open-source Benmore framework - one Go binary that turns Prisma + TSX + YAML
    into a self-hostable web app.

    **Install (macOS/Linux):**
    ```
    curl -fsSL https://raw.githubusercontent.com/Benmore-Studio/benmore/main/install.sh | sh
    ```
    Or download the archive for your platform below, extract, and put `benmore` on your PATH.

# Homebrew tap - disabled for v1. To enable:
#   1. Create a PUBLIC tap repo (e.g. Benmore-Studio/homebrew-tap).
#   2. Add a repo secret HOMEBREW_TAP_TOKEN (a PAT with `contents:write` on the tap)
#      and pass it in release.yml.
#   3. Uncomment this block.
# brews:
#   - name: benmore
#     repository:
#       owner: Benmore-Studio
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
#     homepage: "https://benmore.ai"
#     description: "One Go binary that turns Prisma + TSX + YAML into a self-hostable web app"
#     license: "MIT"
#     install: |
#       bin.install "benmore"
#     test: |
#       system "#{bin}/benmore", "version"
